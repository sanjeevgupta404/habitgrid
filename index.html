<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baingan Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui">
            <div id="score-container">Score: <span id="score">0</span></div>
            <div id="best-score-container">Best: <span id="best-score">0</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>Baingan Snake</h1>
            <button id="start-button">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay" style="display: none;">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-button">Restart</button>
        </div>

        <!-- Mobile Controls -->
        <div id="mobile-controls">
            <div class="control-row">
                <button id="up-button" class="control-btn">Up</button>
            </div>
            <div class="control-row">
                <button id="left-button" class="control-btn">Left</button>
                <button id="down-button" class="control-btn">Down</button>
                <button id="right-button" class="control-btn">Right</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
