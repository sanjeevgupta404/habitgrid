<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik's Cube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <header>
            <h1>Rubik's Cube</h1>
            <div id="stats">
                <span>Moves: <span id="move-count">0</span></span>
            </div>
        </header>

        <div id="game-container">
            <div id="canvas-container"></div>

            <div id="solved-message" class="hidden">
                <h2>Cube Solved!</h2>
            </div>
        </div>

        <div id="controls">
            <div class="control-group">
                <button class="move-btn" data-move="U">U</button>
                <button class="move-btn" data-move="U'">U'</button>
                <button class="move-btn" data-move="D">D</button>
                <button class="move-btn" data-move="D'">D'</button>
                <button class="move-btn" data-move="L">L</button>
                <button class="move-btn" data-move="L'">L'</button>
                <button class="move-btn" data-move="R">R</button>
                <button class="move-btn" data-move="R'">R'</button>
                <button class="move-btn" data-move="F">F</button>
                <button class="move-btn" data-move="F'">F'</button>
                <button class="move-btn" data-move="B">B</button>
                <button class="move-btn" data-move="B'">B'</button>
            </div>
            <div class="action-group">
                <button id="scramble-btn">Scramble</button>
                <button id="reset-btn">Reset</button>
            </div>
            <div class="shortcuts-info">
                <p>Keyboard: R, L, U, D, F, B (Shift for inverse)</p>
            </div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Main Script -->
    <script src="main.js"></script>
</body>
</html>
