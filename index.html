<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baingan Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="score-container">
                <div>Score: <span id="current-score">0</span></div>
                <div>Best: <span id="best-score">0</span></div>
            </div>

            <div id="start-screen" class="overlay">
                <h1>Baingan Snake</h1>
                <button id="start-button">Start Game</button>
            </div>

            <div id="game-over-screen" class="overlay hidden">
                <h1>GAME OVER</h1>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-button">Restart</button>
            </div>
        </div>

        <canvas id="game-canvas" width="400" height="400"></canvas>

        <div id="controls">
            <div class="control-row">
                <button id="up-btn" class="control-btn">UP</button>
            </div>
            <div class="control-row">
                <button id="left-btn" class="control-btn">LEFT</button>
                <button id="down-btn" class="control-btn">DOWN</button>
                <button id="right-btn" class="control-btn">RIGHT</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
