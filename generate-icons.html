<!DOCTYPE html>
<!--
  Icon Generator — open this file in Chrome, it will auto-download all icons.
  Run once, then the icons/ folder is ready for the PWA.
-->
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Generating icons… check your Downloads folder.</p>
<canvas id="c" style="display:none"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

function drawIcon(size) {
  canvas.width = size;
  canvas.height = size;
  const r = size * 0.12;

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#6366f1');
  grad.addColorStop(1, '#8b5cf6');
  ctx.fillStyle = grad;
  // Rounded rect
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Emoji checkmark
  ctx.font = `${size * 0.55}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✅', size / 2, size / 2 + size * 0.03);

  return canvas.toDataURL('image/png');
}

async function download(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  a.click();
  await new Promise(r => setTimeout(r, 300));
}

(async () => {
  for (const size of sizes) {
    const dataUrl = drawIcon(size);
    await download(dataUrl, `icon-${size}.png`);
  }
  document.body.innerHTML = '<p>✅ Done! Move the downloaded files into a folder named <code>icons/</code> next to index.html.</p>';
})();
</script>
</body>
</html>
